<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team 6677G - Web PPT 提詞機 (最終版)</title>
<style>
  :root {
    --primary: #1E3A5F;
    --accent: #E8913A;
    --bg-color: #F4F7FB;
    --card-bg: #FFFFFF;
    --text-main: #333333;
    --fiona: #7B2D8E;
    --hayden: #2E5B8A;
    --lucas: #2E7D32;
    --ryan: #B85C2D;
    --amber: #B82D3E;
    --everyone: #1E3A5F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--primary);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  header {
    background: #16304F;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid var(--accent);
    flex-shrink: 0;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .progress { font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; }

  /* Main Slide Area */
  .slide-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    position: relative;
  }

  .slide {
    background: var(--card-bg);
    width: 100%;
    max-width: 1100px;
    height: 100%;
    max-height: 750px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: fadeIn 0.3s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Slide Header */
  .slide-header {
    background: #EEF2F7;
    padding: 20px 30px;
    border-bottom: 1px solid #DCE3EE;
  }
  .slide-header h2 { font-size: 28px; color: var(--primary); font-weight: 800; }

  /* Visual Suggestion Box */
  .visual-box {
    margin: 20px 30px 0;
    background: #FFF3E0;
    border-left: 5px solid var(--accent);
    padding: 15px 20px;
    border-radius: 0 8px 8px 0;
    font-size: 18px;
    color: #A65A11;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .visual-box::before {
    content: '💡 PPT 畫面建議：';
    background: var(--accent);
    color: white;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 14px;
    white-space: nowrap;
  }

  /* Script Area */
  .script-area {
    padding: 20px 30px;
    flex: 1;
    overflow-y: auto;
  }
  
  .script-line {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
    align-items: flex-start;
  }
  .speaker-badge {
    color: white;
    font-size: 20px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 8px;
    min-width: 120px;
    text-align: center;
    flex-shrink: 0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .script-text {
    font-size: 26px; /* 特大字體方便當提詞機 */
    line-height: 1.6;
    color: #222;
  }
  .new-tag {
    display: inline-block;
    background: #FFD54F;
    color: #B28900;
    font-size: 14px;
    font-weight: 900;
    padding: 3px 8px;
    border-radius: 4px;
    margin-right: 10px;
    vertical-align: middle;
  }

  /* Navigation Footer */
  .nav-footer {
    padding: 15px 30px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-shrink: 0;
  }
  .nav-btn {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 2px solid rgba(255,255,255,0.3);
    padding: 12px 30px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
  }
  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .hint {
    position: absolute;
    bottom: 25px;
    right: 30px;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
  }

  /* Scrollbar */
  .script-area::-webkit-scrollbar { width: 8px; }
  .script-area::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Team 6677G - World Championship Interview</h1>
  <div class="progress" id="progressText">Slide 1 / 11</div>
</header>

<div class="slide-container" id="slideContainer">
  </div>

<div class="nav-footer">
  <button class="nav-btn" id="prevBtn" onclick="prevSlide()">&#8592; Previous</button>
  <button class="nav-btn" id="nextBtn" onclick="nextSlide()">Next &#8594;</button>
</div>
<div class="hint">支援鍵盤 &larr; &rarr; 翻頁</div>

<script>
const NAME_COLORS = {
  Fiona: 'var(--fiona)', Hayden: 'var(--hayden)', Lucas: 'var(--lucas)',
  Ryan: 'var(--ryan)', Amber: 'var(--amber)', Everyone: 'var(--everyone)'
};

const slidesData = [
  {
    title: "Slide 1: Title Slide (首頁)",
    visual: "全隊五人穿著隊服、和五代機器人的帥氣大合照。",
    lines: [
      { name: "Everyone", text: "(保持微笑，看著鏡頭，準備開始！)" }
    ]
  },
  {
    title: "Slide 2: Q1 - Introduction (自我介紹)",
    visual: "五個人的大頭照、名字與負責職位（例如：程式配電腦圖示，筆記本配書本圖示）。",
    lines: [
      { name: "Fiona", text: "Hello, we are Team 6677G. Our team has five members. I'm Fiona. I record our meetings and manage our engineering notebook." },
      { name: "Hayden", text: "I'm Hayden. I mainly work on programming and help with robot structure." },
      { name: "Lucas", text: "I'm Lucas. I design and improve the robot and assist with programming." },
      { name: "Ryan", text: "I'm Ryan. I help design the robot and plan our World Championship pit." },
      { name: "Amber", text: "I'm Amber. I work on notebook layout and English translation." }
    ]
  },
  {
    title: "Slide 3: Q2 - Achievements (本賽季成就)",
    visual: "機器人在三角區疊 3 個 Stack 的特寫照片 ＋ 台灣賽拿 Teamwork Champion 的合照。",
    lines: [
      { name: "Amber", text: "This season, we are proud that our robot's scoring ability improved a lot. At the beginning, we could only stack pins. Now we can place a Small Y on the standoff and build three stacks in the triangle goal." },
      { name: "Fiona", text: "We also improved our teamwork. This is our first year working together, so we had different ideas. We learned to communicate, share opinions, and vote to make decisions. In the end, we achieved the Teamwork Champion award in Taiwan." }
    ]
  },
  {
    title: "Slide 4: Q3 - Challenges (遇到的挑戰)",
    visual: "爪子的特寫照片（標示增加摩擦力）、Hook Arm 舉臂的照片（標示齒輪比 2.5 → 5）。",
    lines: [
      { name: "Lucas", text: "One challenge was that our claw could not hold pins stably. We tested different designs, increased friction, and adjusted the program. After many tests, the claw became much more stable." },
      { name: "Lucas", isNew: true, text: "Another challenge was our hook arm could not lift high enough. We changed the gear ratio from 2.5 to 5 for more torque, and added another motor. Now it can lift above 20 centimeters to place the beam on the standoff." },
      { name: "Ryan", text: "Another problem was scoring in the triangle goal. We changed the guide design, claw angle, and programming. Now we can consistently place three stacks." }
    ]
  },
  {
    title: "Slide 5: Q4 - Game Strategy (比賽策略)",
    visual: "六種 Game Plans 的圖解，或者是 Skills Drive 35秒 / 25秒的時間分配示意圖。",
    lines: [
      { name: "Ryan", text: "First, we study the game rules and scoring system. Then we test different strategies and choose the most stable one. For teamwork matches, we communicate with our alliance and understand their abilities. We prepared six different game plans and practiced all of them many times." },
      { name: "Ryan", text: "For example, when our alliance had only a 20% success rate for building a Y, we changed the strategy and took over that task to improve consistency." },
      { name: "Hayden", isNew: true, text: "For Skills Drive, we split the driving time. The first driver has 35 seconds to finish the Tower Y and Floor Y. The second driver has 25 seconds to stack matches in the center and triangle area." },
      { name: "Hayden", isNew: true, text: "For Skills Autonomous, we use the rule that lets us pick up the robot by hand. After completing two Ys, we quickly bring the robot back to the start and use the Loader to rapidly stack matches." }
    ]
  },
  {
    title: "Slide 6: Q5 - Engineering Design Process (工程設計流程)",
    visual: "工程設計流程 (EDP) 的循環圖，旁邊放一張團隊在看影片討論或腦力激盪的照片。",
    lines: [
      { name: "Hayden", text: "We follow the engineering design process. First, we identify problems. Then we brainstorm ideas and do research online." },
      { name: "Hayden", isNew: true, text: "For our research, we study competition videos of top teams. For example, learning from Chinese teams and their clutch designs gave us great inspiration!" },
      { name: "Lucas", text: "After choosing a solution, we build, test, and improve. Sometimes the design does not work, so we restart and try again. Through many iterations, we developed our fifth-generation robot." }
    ]
  },
  {
    title: "Slide 7: Q6 - Robot Reliability (機器人穩定性)",
    visual: "髒掉/舊的橡皮筋對比圖、以及螺絲 vs. 插銷 (Pin connectors) 的強固對比照片。",
    lines: [
      { name: "Fiona", text: "We believe testing is very important. We test our robot many times to find problems. When we find issues, we discuss and improve them. We also check parts and replace batteries regularly. If battery level is below 70%, we change it." },
      { name: "Fiona", isNew: true, text: "We also discovered that dirty rubber bands reduce friction, so we replace them. For structures that easily crash, we use pin connectors instead of screws to make them stronger. We also added guide angles and position limits to make sure the claw is always in the correct spot." },
      { name: "Amber", text: "We also use slow-motion video to analyze the robot. This helps us find problems more precisely and improve performance." }
    ]
  },
  {
    title: "Slide 8: Q7 - Creativity (最具創意的設計)",
    visual: "PTO 離合器的特寫照、大大的數字標示「14.5% Faster」與「8.7 sec more」、U型導角特寫。",
    lines: [
      { name: "Amber", text: "Our most creative design is our PTO clutch system using pneumatics. Because this design our robot has a four-motor drivetrain, it helps reduce speed loss when carrying objects and turning." },
      { name: "Amber", text: "When the pneumatic shaft extends, it powers the drivetrain. When it retracts, it powers the hook arm." },
      { name: "Amber", text: "We tested our Gen 4 and Gen 5 robots under different loads. Our Gen 5 is about 14.5% faster. This gives us about 8.7 more seconds in a 60-second run, which helps us score more points." },
      { name: "Lucas", isNew: true, text: "Besides the clutch, we also designed a U-shaped guide. This positioning structure makes it much more stable and accurate when we place a U-shaped object on a stack of two pins." }
    ]
  },
  {
    title: "Slide 9: Q8 - Programming (程式設計)",
    visual: "程式碼截圖（顯示 My Blocks 或是 Wait Until），搭配 Touch LED 亮綠燈/紅燈的照片。",
    lines: [
      { name: "Hayden", text: "For Autonomous, we run a reset routine to ensure consistency every time the robot starts. We use the Touch LED as a status indicator. A flashing red light means the gyro is calibrating. Using the gyro helps make the robot's movement more stable." },
      { name: "Hayden", text: "We also use a distance sensor to detect the distance between the claw and the pin, which helps with accurate grabbing during Autonomous." },
      { name: "Hayden", isNew: true, text: "For Driver-Controlled mode, we use 'wait until' commands and safety checks to prevent actions from triggering twice." },
      { name: "Hayden", isNew: true, text: "We also use the Touch LED to help the driver. A green light means the claw is at the lowest position, so we know it is safe to grab the Pin without slipping." }
    ]
  },
  {
    title: "Slide 10: Q9 - Project Management (專案管理)",
    visual: "Timeline 時間軸截圖、工程筆記本內頁照片、電腦存檔畫面（強調檔名加上日期，例如 Auto_0325）。",
    lines: [
      { name: "Fiona", text: "We use a timeline and weekly meetings to track progress. We check our to-do list to make sure tasks are completed on time." },
      { name: "Amber", text: "We record all changes and test results in our engineering notebook. This helps us understand what works and what needs improvement." },
      { name: "Hayden", isNew: true, text: "For programming, every time we test, we save the project with a new name and add the date. This makes sure our old files are never overwritten, and we can easily find our old test data." }
    ]
  },
  {
    title: "Slide 11: Q10 - Closing (結語)",
    visual: "大大的「Thank You」字樣，搭配團隊在賽場上的活力合照。",
    lines: [
      { name: "Fiona", text: "Thank you for listening. We are proud of our teamwork, continuous improvement, and engineering process." }
    ]
  }
];

let currentSlide = 0;

function renderSlide() {
  const container = document.getElementById('slideContainer');
  const slide = slidesData[currentSlide];
  
  let linesHtml = slide.lines.map(line => `
    <div class="script-line">
      <div class="speaker-badge" style="background-color: ${NAME_COLORS[line.name] || 'var(--primary)'}">${line.name}</div>
      <div class="script-text">
        ${line.isNew ? '<span class="new-tag">NEW</span>' : ''}${line.text}
      </div>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="slide">
      <div class="slide-header">
        <h2>${slide.title}</h2>
      </div>
      <div class="visual-box">${slide.visual}</div>
      <div class="script-area">
        ${linesHtml}
      </div>
    </div>
  `;

  document.getElementById('progressText').innerText = `Slide ${currentSlide + 1} / ${slidesData.length}`;
  document.getElementById('prevBtn').disabled = currentSlide === 0;
  document.getElementById('nextBtn').disabled = currentSlide === slidesData.length - 1;
}

function prevSlide() {
  if (currentSlide > 0) {
    currentSlide--;
    renderSlide();
  }
}

function nextSlide() {
  if (currentSlide < slidesData.length - 1) {
    currentSlide++;
    renderSlide();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    nextSlide();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    prevSlide();
  }
});

// Initialize
renderSlide();
</script>
</body>
</html>
